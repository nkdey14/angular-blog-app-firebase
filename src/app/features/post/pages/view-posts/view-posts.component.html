<section class="min-h-screen bg-gray-100 px-4 py-10">
  <div class="mx-auto max-w-7xl">
    <!-- Page Header -->
    <div
      class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between"
    >
      <div>
        <h1 class="text-3xl font-bold text-gray-800">Published Posts</h1>

        <p class="mt-1 text-gray-500">
          Browse all the posts published on the blog.
        </p>
      </div>

      <a
        routerLink="/newPost"
        class="inline-flex items-center justify-center gap-2 rounded-lg bg-blue-600 px-5 py-2.5 font-semibold text-white transition hover:bg-blue-700"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 4v16m8-8H4"
          />
        </svg>

        New Post
      </a>
    </div>

    <!-- Loading Message -->
    <div
      *ngIf="isLoading"
      class="rounded-xl bg-white p-10 text-center shadow-md"
    >
      <div
        class="mx-auto mb-4 h-10 w-10 animate-spin rounded-full border-4 border-gray-200 border-t-blue-600"
      ></div>

      <p class="text-gray-600">Loading posts...</p>
    </div>

    <!-- Error Message -->
    <div
      *ngIf="errorMessage"
      class="mb-6 rounded-lg border border-red-200 bg-red-50 px-5 py-4 text-red-700"
    >
      {{ errorMessage }}
    </div>

    <ng-container *ngIf="posts$ | async as posts">
      <!-- Posts Grid -->
      <div
        *ngIf="!isLoading && !errorMessage && posts.length > 0; else noPosts"
        class="grid gap-7 md:grid-cols-2 lg:grid-cols-3"
      >
        <article
          *ngFor="let post of posts; trackBy: trackPost"
          class="overflow-hidden rounded-xl bg-white shadow-md transition duration-300 hover:-translate-y-1 hover:shadow-xl"
        >
          <!-- Post Image -->
          <div
            *ngIf="post.imageUrl; else noImage"
            class="h-52 overflow-hidden bg-gray-200"
          >
            <img
              [src]="post.imageUrl"
              [alt]="post.title"
              class="h-full w-full object-cover transition duration-300 hover:scale-105"
            />
          </div>

          <!-- Image Placeholder -->
          <ng-template #noImage>
            <div
              class="flex h-52 items-center justify-center bg-gradient-to-br from-blue-100 to-blue-200"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-16 w-16 text-blue-400"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M19 11H5m14-4H5m14 8H5m14 4H5"
                />
              </svg>
            </div>
          </ng-template>

          <!-- Post Details -->
          <div class="p-6">
            <div
              *ngIf="post.publishedOn"
              class="mb-3 flex items-center gap-2 text-sm text-gray-500"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M8 7V3m8 4V3M5 11h14M5 5h14a2 2 0 012 2v12a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z"
                />
              </svg>

              {{ getPublishedDate(post.publishedOn) | date: "medium" }}
            </div>

            <h2 class="mb-3 text-xl font-bold text-gray-800">
              {{ post.title }}
            </h2>

            <p class="whitespace-pre-line text-gray-600">
              {{ post.content }}
            </p>
          </div>
        </article>
      </div>

      <!-- Empty Posts Message -->
      <ng-template #noPosts>
        <div
          *ngIf="!isLoading && !errorMessage"
          class="rounded-xl bg-white p-12 text-center shadow-md"
        >
          <div
            class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-blue-100 text-blue-600"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-8 w-8"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 4v16m8-8H4"
              />
            </svg>
          </div>

          <h2 class="mb-2 text-xl font-semibold text-gray-800">
            No posts available
          </h2>

          <p class="mb-6 text-gray-500">
            Publish your first blog post to see it here.
          </p>

          <a
            routerLink="/newPost"
            class="inline-block rounded-lg bg-blue-600 px-5 py-2.5 font-semibold text-white transition hover:bg-blue-700"
          >
            Create New Post
          </a>
        </div>
      </ng-template>
    </ng-container>
  </div>
</section>
