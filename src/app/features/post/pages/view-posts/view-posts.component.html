<section
  class="min-h-screen bg-gray-100 px-4 py-10 transition-colors duration-300 dark:bg-gray-950"
>
  <div class="mx-auto max-w-7xl">
    <!-- Page Header -->
    <div
      class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between"
    >
      <div>
        <h1 class="text-3xl font-bold text-gray-800 dark:text-white">
          Published Posts
        </h1>

        <p class="mt-1 text-gray-500 dark:text-gray-400">
          View and manage all your published posts.
        </p>
      </div>

      <!-- New Post Button -->
      <a
        routerLink="/newPost"
        class="inline-flex items-center justify-center gap-2 rounded-lg bg-blue-600 px-5 py-2.5 font-semibold text-white transition hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 4v16m8-8H4"
          />
        </svg>

        New Post
      </a>
    </div>

    <!-- Posts -->
    <ng-container *ngIf="posts$ | async as posts">
      <!-- Posts Grid -->
      <div
        *ngIf="posts.length > 0; else noPosts"
        class="grid gap-6 md:grid-cols-2 lg:grid-cols-3"
      >
        <!-- Post Card -->
        <article
          *ngFor="let post of posts; trackBy: trackPost"
          class="flex flex-col overflow-hidden rounded-xl bg-white shadow-md transition duration-300 hover:-translate-y-1 hover:shadow-xl dark:bg-gray-900 dark:shadow-gray-950/50"
        >
          <!-- Post Image -->
          <div
            *ngIf="post.imageUrl; else noImage"
            class="h-52 overflow-hidden bg-gray-200 dark:bg-gray-800"
          >
            <img
              [src]="post.imageUrl"
              [alt]="post.title"
              class="h-full w-full object-cover transition duration-300 hover:scale-105"
            />
          </div>

          <!-- No Image Placeholder -->
          <ng-template #noImage>
            <div
              class="flex h-52 items-center justify-center bg-gradient-to-br from-blue-100 to-blue-200 dark:from-gray-800 dark:to-gray-700"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-16 w-16 text-blue-400 dark:text-gray-500"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M19 11H5m14-4H5m14 8H5m14 4H5"
                />
              </svg>
            </div>
          </ng-template>

          <!-- Post Content -->
          <div class="flex flex-1 flex-col p-6">
            <!-- Post Title -->
            <h2 class="mb-3 text-xl font-bold text-gray-800 dark:text-white">
              {{ post.title }}
            </h2>

            <!-- Post Description -->
            <p
              class="mb-5 whitespace-pre-line break-words text-gray-600 dark:text-gray-300"
            >
              {{ post.content }}
            </p>

            <!-- Edit and Delete Icons -->
            <div
              class="mt-auto flex justify-end gap-2 border-t border-gray-100 pt-4 dark:border-gray-700"
            >
              <!-- Edit Icon -->
              <a
                [routerLink]="['/posts/edit', post.id]"
                title="Edit post"
                aria-label="Edit post"
                class="flex h-10 w-10 items-center justify-center rounded-full bg-amber-100 text-amber-600 transition duration-200 hover:bg-amber-500 hover:text-white dark:bg-amber-900/40 dark:text-amber-400 dark:hover:bg-amber-500 dark:hover:text-white"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5"
                  />

                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"
                  />
                </svg>
              </a>

              <!-- Delete Icon -->
              <button
                type="button"
                (click)="deletePost(post)"
                [disabled]="deletingPostId === post.id"
                title="Delete post"
                aria-label="Delete post"
                class="flex h-10 w-10 items-center justify-center rounded-full bg-red-100 text-red-600 transition duration-200 hover:bg-red-600 hover:text-white disabled:cursor-not-allowed disabled:opacity-50 dark:bg-red-900/40 dark:text-red-400 dark:hover:bg-red-600 dark:hover:text-white"
              >
                <!-- Trash Icon -->
                <svg
                  *ngIf="deletingPostId !== post.id"
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7"
                  />

                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M10 11v6m4-6v6M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3M4 7h16"
                  />
                </svg>

                <!-- Loading Spinner -->
                <svg
                  *ngIf="deletingPostId === post.id"
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5 animate-spin"
                  fill="none"
                  viewBox="0 0 24 24"
                >
                  <circle
                    class="opacity-25"
                    cx="12"
                    cy="12"
                    r="10"
                    stroke="currentColor"
                    stroke-width="4"
                  ></circle>

                  <path
                    class="opacity-75"
                    fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
                  ></path>
                </svg>
              </button>
            </div>
          </div>
        </article>
      </div>
    </ng-container>

    <!-- No Posts -->
    <ng-template #noPosts>
      <div
        class="rounded-xl bg-white p-12 text-center shadow-md transition-colors duration-300 dark:bg-gray-900 dark:shadow-gray-950/50"
      >
        <div
          class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-blue-100 text-blue-600 dark:bg-blue-900/40 dark:text-blue-400"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-8 w-8"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 4v16m8-8H4"
            />
          </svg>
        </div>

        <h2 class="mb-2 text-xl font-semibold text-gray-800 dark:text-white">
          No posts available
        </h2>

        <p class="mb-6 text-gray-500 dark:text-gray-400">
          Publish your first blog post to see it here.
        </p>

        <a
          routerLink="/newPost"
          class="inline-block rounded-lg bg-blue-600 px-5 py-2.5 font-semibold text-white transition hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600"
        >
          Create New Post
        </a>
      </div>
    </ng-template>
  </div>
</section>
