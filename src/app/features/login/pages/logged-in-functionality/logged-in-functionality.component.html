<div class="relative profile-dropdown">
  <!-- Profile Button -->
  <button
    type="button"
    (click)="toggleDropdown()"
    class="flex items-center gap-2 rounded-lg px-3 py-2 text-white hover:bg-blue-700 transition duration-200 focus:outline-none"
  >
    <!-- Profile Icon -->
    <div
      class="flex h-9 w-9 items-center justify-center rounded-full bg-white text-blue-600"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M5.121 17.804A9 9 0 1118.88 17.8M15 9a3 3 0 11-6 0 3 3 0 016 0z"
        />
      </svg>
    </div>

    <!-- Username -->
    <span class="hidden sm:block text-sm font-medium"> Profile </span>

    <!-- Dropdown Arrow -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-4 w-4 transition-transform duration-200"
      [class.rotate-180]="isDropdownOpen"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="2"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <!-- Dropdown Menu -->
  <div
    *ngIf="isDropdownOpen"
    class="absolute right-0 z-50 mt-2 w-60 overflow-hidden rounded-xl border border-gray-200 bg-white shadow-xl"
  >
    <!-- Profile Header -->
    <div class="border-b border-gray-200 px-4 py-4">
      <div class="flex items-center gap-3">
        <div
          class="flex h-11 w-11 items-center justify-center rounded-full bg-blue-100 text-blue-600"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M5.121 17.804A9 9 0 1118.88 17.8M15 9a3 3 0 11-6 0 3 3 0 016 0z"
            />
          </svg>
        </div>

        <div>
          <p class="text-sm font-semibold text-gray-800">My Account</p>
          <p class="text-xs text-gray-500">Manage your account</p>
        </div>
      </div>
    </div>

    <!-- Menu Items -->

    <!-- Profile -->
    <a
      routerLink="/profile"
      (click)="closeDropdown()"
      class="flex items-center gap-3 px-4 py-3 text-sm text-gray-700 hover:bg-gray-100 transition duration-150"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5 text-gray-500"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
        />
      </svg>

      <span>Profile</span>
    </a>

    <!-- Settings -->
    <a
      routerLink="/settings"
      (click)="closeDropdown()"
      class="flex items-center gap-3 px-4 py-3 text-sm text-gray-700 hover:bg-gray-100 transition duration-150"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5 text-gray-500"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
        />
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
        />
      </svg>

      <span>Settings</span>
    </a>

    <!-- Dashboard -->
    <a
      routerLink="/dashboard"
      (click)="closeDropdown()"
      class="flex items-center gap-3 px-4 py-3 text-sm text-gray-700 hover:bg-gray-100 transition duration-150"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5 text-gray-500"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"
        />
      </svg>

      <span>Dashboard</span>
    </a>

    <!-- Notifications -->
    <a
      routerLink="/notifications"
      (click)="closeDropdown()"
      class="flex items-center gap-3 px-4 py-3 text-sm text-gray-700 hover:bg-gray-100 transition duration-150"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5 text-gray-500"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
        />
      </svg>

      <span>Notifications</span>
    </a>

    <!-- Help -->
    <a
      routerLink="/help"
      (click)="closeDropdown()"
      class="flex items-center gap-3 px-4 py-3 text-sm text-gray-700 hover:bg-gray-100 transition duration-150"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5 text-gray-500"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M8.228 9.247a4 4 0 117.544 0c0 1.5-1.5 2.253-2.772 3.126-.628.43-1 1.107-1 1.875M12 17h.01"
        />
      </svg>

      <span>Help & Support</span>
    </a>

    <!-- Divider -->
    <div class="border-t border-gray-200"></div>

    <!-- Logout -->
    <button
      type="button"
      (click)="logout()"
      class="flex w-full items-center gap-3 px-4 py-3 text-sm text-red-600 hover:bg-red-50 transition duration-150"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1"
        />
      </svg>

      <span>Logout</span>
    </button>
  </div>
</div>
