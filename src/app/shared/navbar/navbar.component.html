<nav
  class="bg-blue-600 text-white shadow-md transition-colors duration-300 dark:bg-gray-900"
>
  <div class="mx-auto max-w-7xl px-4">
    <div class="flex h-16 items-center">
      <!-- Logo -->
      <a routerLink="/" aria-label="Blog home" class="shrink-0">
        <img
          src="assets/logo.jfif"
          width="40"
          height="40"
          class="h-10 w-10 rounded-full object-cover"
          alt="Blog Logo"
        />
      </a>

      <!-- Navbar Actions -->
      <div class="ml-auto flex items-center gap-3">
        <!-- Logged-in Actions -->
        <ng-container *ngIf="authService.isLoggedIn; else loggedOut">
          <!-- New Post -->
          <a
            routerLink="/newPost"
            routerLinkActive="ring-2 ring-white"
            class="rounded-lg bg-white px-4 py-2 text-sm font-semibold text-blue-600 transition hover:bg-blue-50 dark:bg-gray-700 dark:text-white dark:hover:bg-gray-600"
          >
            New Post
          </a>

          <!-- View Posts -->
          <a
            routerLink="/posts"
            routerLinkActive="bg-blue-800 dark:bg-gray-700"
            class="rounded-lg border border-white px-4 py-2 text-sm font-semibold text-white transition hover:bg-blue-700 dark:hover:bg-gray-700"
          >
            View Posts
          </a>

          <!-- Profile -->
          <app-logged-in-functionality> </app-logged-in-functionality>
        </ng-container>

        <!-- Logged-out Actions -->
        <ng-template #loggedOut>
          <app-logged-out-functionality> </app-logged-out-functionality>
        </ng-template>

        <!-- Theme Toggle -->
        <button
          type="button"
          (click)="themeService.toggleTheme()"
          [attr.aria-label]="
            themeService.isDarkMode
              ? 'Switch to light mode'
              : 'Switch to dark mode'
          "
          [title]="themeService.isDarkMode ? 'Light mode' : 'Dark mode'"
          class="flex h-10 w-10 items-center justify-center rounded-full border border-white/50 bg-white/10 text-white transition hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-white"
        >
          <!-- Moon Icon -->
          <svg
            *ngIf="!themeService.isDarkMode"
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"
            />
          </svg>

          <!-- Sun Icon -->
          <svg
            *ngIf="themeService.isDarkMode"
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="4" />

            <path
              stroke-linecap="round"
              d="M12 2v2m0 16v2
                 M4.93 4.93l1.42 1.42
                 m11.3 11.3 1.42 1.42
                 M2 12h2m16 0h2
                 M4.93 19.07l1.42-1.42
                 m11.3-11.3 1.42-1.42"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>
</nav>

<router-outlet></router-outlet>
